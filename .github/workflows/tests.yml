# Runs the offline suite on the three operating systems the CLI promises, on the oldest and newest Python it
# supports, and fails at red on the size budget. The live smoke test runs too and skips: CI has no Gemini key,
# and none should be added (a key in CI would spend the owner's quota on every push).
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: offline tests
        run: python tests/test_fetchwright.py
      - name: live smoke test (skips without a key)
        run: python tests/smoke_live.py
      - name: the CLI answers from a clean checkout
        run: python skills/fetchwright/scripts/fetchwright.py check --no-call || test $? -eq 4
        shell: bash
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: size budget (fails at red)
        run: python scripts/budget.py
